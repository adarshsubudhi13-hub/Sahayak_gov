<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sahayak — AI Government Scheme Navigator</title>
    <meta name="description" content="Sahayak helps Indian citizens discover, understand, and apply for government welfare schemes. Covers 11 states plus central schemes with a citation-grounded AI assistant." />
    <meta name="theme-color" content="#0f6e5e" />
    <!-- Open Graph -->
    <meta property="og:title" content="Sahayak — AI Government Scheme Navigator" />
    <meta property="og:description" content="Discover every government welfare scheme you qualify for, with cited official sources. Covers all major Indian states." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Google Fonts: Inter + Noto Sans for Indian scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
